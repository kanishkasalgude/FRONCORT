<h2 class="sr-only">Entity relationship diagram for the unified org workspace database</h2>
<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USER ||--o{ ORG_MEMBERSHIP : has
  ORG ||--o{ ORG_MEMBERSHIP : has
  USER ||--o{ SESSION : has
  ORG ||--o{ ORG_CONNECTION : requests
  ORG ||--o{ TICKET : owns
  USER ||--o{ TICKET : creates
  TICKET ||--o{ TICKET_COMMENT : has
  TICKET ||--o{ TICKET_ATTACHMENT : has
  ORG ||--o{ FEATURE_FLAG : has
  ORG ||--o{ PULL_REQUEST : owns
  USER ||--o{ PULL_REQUEST : authors
  PULL_REQUEST ||--o{ PR_REVIEWER : has
  PULL_REQUEST ||--o{ PR_VERSION : has
  ORG ||--o{ RESOURCE_SHARE : grants
  USER ||--o{ RESOURCE_SHARE : receives
  ORG ||--o{ AUDIT_LOG : scoped_to
  USER ||--o{ AUDIT_LOG : performs
  USER ||--o{ DIGEST : receives

  USER {
    uuid id PK
    string email
    string passwordHash
    bool isPlatformAdmin
  }
  ORG {
    uuid id PK
    string name
  }
  ORG_MEMBERSHIP {
    uuid id PK
    uuid userId FK
    uuid orgId FK
    enum role
  }
  SESSION {
    uuid id PK
    uuid userId FK
    string refreshTokenHash
    timestamp revokedAt
  }
  ORG_CONNECTION {
    uuid id PK
    uuid requesterOrgId FK
    uuid partnerOrgId FK
    enum status
  }
  TICKET {
    uuid id PK
    uuid orgId FK
    string title
    enum status
    uuid assignedToId FK
  }
  TICKET_COMMENT {
    uuid id PK
    uuid ticketId FK
    uuid authorId FK
    text body
  }
  TICKET_ATTACHMENT {
    uuid id PK
    uuid ticketId FK
    string url
  }
  FEATURE_FLAG {
    uuid id PK
    uuid orgId FK
    string key
    bool enabled
  }
  PULL_REQUEST {
    uuid id PK
    uuid orgId FK
    uuid authorId FK
    enum status
    int requiredApprovals
  }
  PR_REVIEWER {
    uuid id PK
    uuid prId FK
    uuid userId FK
    enum approvalStatus
  }
  PR_VERSION {
    uuid id PK
    uuid prId FK
    int versionNumber
  }
  RESOURCE_SHARE {
    uuid id PK
    enum resourceType
    uuid resourceId
    uuid sharedWithOrgId FK
    uuid sharedWithUserId FK
    timestamp revokedAt
  }
  AUDIT_LOG {
    uuid id PK
    uuid orgId FK
    uuid actorId FK
    string action
    jsonb metadata
  }
  DIGEST {
    uuid id PK
    uuid userId FK
    uuid orgId FK
    jsonb content
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
