name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Typecheck
      run: npm run typecheck || npx tsc -b
      
    - name: Test
      run: npm test
      
    - name: Build packages and apps
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build API image
      run: docker build -t workspace-api -f apps/workspace-api/Dockerfile .
      
    - name: Build Support Web image
      run: docker build -t support-web -f apps/support-web/Dockerfile .
      
    - name: Build Review Web image
      run: docker build -t review-web -f apps/review-web/Dockerfile .
